[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-execution-safety-lab"
version = "1.1.0"
description = "Offline-first trade execution safety, conformance checks, and a testnet reference adapter."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mark Cruz" }]
keywords = [
  "ai-automation",
  "api-integration",
  "adapter-pattern",
  "broker-simulation",
  "exchange-simulation",
  "execution-safety",
  "order-reconciliation",
  "python",
  "reliability-engineering",
  "state-machines",
  "testnet",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
bybit-testnet = ["pybit==5.17.0"]

[project.scripts]
trade-safety-lab = "trade_execution_safety_lab.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
