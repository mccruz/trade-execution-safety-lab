<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Trade Execution Safety Lab</title>
  <desc id="desc">Offline-first Python execution safety with deterministic simulation, provider conformance checks, and an optional Bybit Testnet adapter.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071525"/>
      <stop offset="1" stop-color="#123450"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020812" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <rect x="54" y="48" width="12" height="172" rx="6" fill="#55d6ff"/>
  <text x="94" y="126" fill="#f7fbff" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="750">Trade Execution</text>
  <text x="94" y="202" fill="#f7fbff" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="750">Safety Lab</text>
  <text x="94" y="257" fill="#b8cce0" font-family="Inter, Arial, sans-serif" font-size="28">Provider-neutral controls + optional Bybit Testnet adapter.</text>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <g>
      <rect x="80" y="330" width="340" height="160" rx="24" fill="#123f61" stroke="#3b91c4" stroke-width="3"/>
      <circle cx="130" cy="380" r="18" fill="none" stroke="#55d6ff" stroke-width="6"/>
      <path d="M 121 380 L 128 387 L 142 371" fill="none" stroke="#55d6ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="170" y="389" fill="#ffffff" font-size="30" font-weight="700">Validate</text>
      <text x="130" y="440" fill="#c4d8e8" font-size="21">Ticks · quantity · minimums</text>
    </g>
    <g>
      <rect x="470" y="330" width="340" height="160" rx="24" fill="#123f61" stroke="#3b91c4" stroke-width="3"/>
      <path d="M 525 366 V 394 M 511 380 H 539" fill="none" stroke="#57e3b3" stroke-width="6" stroke-linecap="round"/>
      <circle cx="525" cy="380" r="24" fill="none" stroke="#57e3b3" stroke-width="5"/>
      <text x="570" y="389" fill="#ffffff" font-size="30" font-weight="700">Reconcile</text>
      <text x="520" y="440" fill="#c4d8e8" font-size="21">Venue positions are truth</text>
    </g>
    <g>
      <rect x="860" y="330" width="340" height="160" rx="24" fill="#123f61" stroke="#3b91c4" stroke-width="3"/>
      <path d="M 915 356 L 941 368 V 388 C 941 404 930 416 915 423 C 900 416 889 404 889 388 V 368 Z" fill="none" stroke="#ffc857" stroke-width="5" stroke-linejoin="round"/>
      <text x="960" y="389" fill="#ffffff" font-size="30" font-weight="700">Conform</text>
      <text x="910" y="440" fill="#c4d8e8" font-size="21">States · fills · transitions</text>
    </g>
  </g>

  <text x="80" y="570" fill="#55d6ff" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">PYTHON · OFFLINE-FIRST · BYBIT TESTNET · NO MAINNET</text>
  <text x="1200" y="570" text-anchor="end" fill="#a9bed2" font-family="Inter, Arial, sans-serif" font-size="22">mccruz</text>
</svg>
