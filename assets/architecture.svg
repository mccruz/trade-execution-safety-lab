<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Trade execution safety architecture</title>
  <desc id="desc">A synthetic order passes through validation, preflight position reconciliation, idempotent submission, bounded observation and cancellation, postflight reconciliation, and a checksummed receipt. Only a filled and reconciled order may continue; blocked and uncertain outcomes require human review.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071525"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55d6ff"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020812" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1440" height="760" rx="28" fill="url(#background)"/>

  <text x="64" y="76" fill="#f6f9fc" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">Offline execution-safety workflow</text>
  <text x="64" y="116" fill="#a9bed2" font-family="Inter, Arial, sans-serif" font-size="22">Synthetic data · deterministic venue · no credentials · no network</text>

  <rect x="64" y="150" width="1312" height="52" rx="18" fill="#0d2237" stroke="#2a5270"/>
  <text x="720" y="183" text-anchor="middle" fill="#c9d9e8" font-family="Inter, Arial, sans-serif" font-size="18">Proceed to the next control only when the current evidence is safe.</text>

  <g fill="none" stroke="#55d6ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M 230 330 H 274"/>
    <path d="M 450 330 H 494"/>
    <path d="M 670 330 H 714"/>
    <path d="M 890 330 H 934"/>
    <path d="M 1110 330 H 1154"/>
    <path d="M 1250 410 V 468 H 980 V 590 H 950"/>
    <path d="M 650 590 H 590"/>
    <path d="M 950 590 H 1050"/>
  </g>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <g>
      <rect x="50" y="260" width="180" height="150" rx="22" fill="#123f61" stroke="#3b91c4" stroke-width="3"/>
      <circle cx="140" cy="295" r="11" fill="#57e3b3"/>
      <text x="140" y="338" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="700">Synthetic intent</text>
      <text x="140" y="371" text-anchor="middle" fill="#c4d8e8" font-size="18">DEMO-USD only</text>
    </g>
    <g>
      <rect x="270" y="260" width="180" height="150" rx="22" fill="#123f61" stroke="#3b91c4" stroke-width="3"/>
      <text x="360" y="318" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="700">Validate</text>
      <text x="360" y="352" text-anchor="middle" fill="#c4d8e8" font-size="18">Price · tick · qty</text>
      <text x="360" y="380" text-anchor="middle" fill="#c4d8e8" font-size="18">Minimum checks</text>
    </g>
    <g>
      <rect x="490" y="260" width="180" height="150" rx="22" fill="#123f61" stroke="#3b91c4" stroke-width="3"/>
      <text x="580" y="312" text-anchor="middle" fill="#ffffff" font-size="23" font-weight="700">Preflight</text>
      <text x="580" y="341" text-anchor="middle" fill="#ffffff" font-size="23" font-weight="700">reconcile</text>
      <text x="580" y="377" text-anchor="middle" fill="#c4d8e8" font-size="18">Venue is truth</text>
    </g>
    <g>
      <rect x="710" y="260" width="180" height="150" rx="22" fill="#123f61" stroke="#3b91c4" stroke-width="3"/>
      <text x="800" y="318" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="700">Submit once</text>
      <text x="800" y="352" text-anchor="middle" fill="#c4d8e8" font-size="18">Idempotent</text>
      <text x="800" y="380" text-anchor="middle" fill="#c4d8e8" font-size="18">client order ID</text>
    </g>
    <g>
      <rect x="930" y="260" width="180" height="150" rx="22" fill="#123f61" stroke="#3b91c4" stroke-width="3"/>
      <text x="1020" y="312" text-anchor="middle" fill="#ffffff" font-size="23" font-weight="700">Observe</text>
      <text x="1020" y="341" text-anchor="middle" fill="#ffffff" font-size="23" font-weight="700">or cancel</text>
      <text x="1020" y="377" text-anchor="middle" fill="#c4d8e8" font-size="18">Bounded + race-safe</text>
    </g>
    <g>
      <rect x="1150" y="260" width="200" height="150" rx="22" fill="#123f61" stroke="#3b91c4" stroke-width="3"/>
      <text x="1250" y="312" text-anchor="middle" fill="#ffffff" font-size="23" font-weight="700">Postflight</text>
      <text x="1250" y="341" text-anchor="middle" fill="#ffffff" font-size="23" font-weight="700">reconcile</text>
      <text x="1250" y="377" text-anchor="middle" fill="#c4d8e8" font-size="18">Fills → positions</text>
    </g>
  </g>

  <g font-family="Inter, Arial, sans-serif" filter="url(#shadow)">
    <g>
      <rect x="650" y="520" width="300" height="140" rx="24" fill="#153e5d" stroke="#55d6ff" stroke-width="3"/>
      <text x="800" y="574" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="700">Typed receipt</text>
      <text x="800" y="608" text-anchor="middle" fill="#c4d8e8" font-size="18">Atomic · SHA-256</text>
      <text x="800" y="636" text-anchor="middle" fill="#c4d8e8" font-size="18">Restart evidence</text>
    </g>
    <g>
      <rect x="290" y="520" width="300" height="140" rx="24" fill="#4a3112" stroke="#ffc857" stroke-width="3"/>
      <text x="440" y="574" text-anchor="middle" fill="#fff4d6" font-size="26" font-weight="700">Human review</text>
      <text x="440" y="608" text-anchor="middle" fill="#f4ddb1" font-size="18">Unknown · drift · partial</text>
      <text x="440" y="636" text-anchor="middle" fill="#f4ddb1" font-size="18">No automatic continuation</text>
    </g>
    <g>
      <rect x="1050" y="520" width="300" height="140" rx="24" fill="#123f37" stroke="#57e3b3" stroke-width="3"/>
      <text x="1200" y="574" text-anchor="middle" fill="#e8fff7" font-size="26" font-weight="700">Continue safely</text>
      <text x="1200" y="608" text-anchor="middle" fill="#bdebdc" font-size="18">Filled + reconciled</text>
      <text x="1200" y="636" text-anchor="middle" fill="#bdebdc" font-size="18">Synthetic workflow only</text>
    </g>
  </g>

  <text x="720" y="718" text-anchor="middle" fill="#91abc0" font-family="Inter, Arial, sans-serif" font-size="17">Every blocked or uncertain outcome still produces verifiable evidence.</text>
</svg>
